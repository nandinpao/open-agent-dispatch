        setupState: {type: string}
        setupExpiresAt: {type: string, format: date-time, nullable: true}
        deliveryMethod: {type: string, enum: [NOT_ISSUED, EMAIL, MANUAL, DEVELOPMENT_FILE]}
        deliveryStatus: {type: string, enum: [NOT_ISSUED, ISSUED, QUEUED, DELIVERED, FAILED, CONSUMED, EXPIRED, REVOKED]}
