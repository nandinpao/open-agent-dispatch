components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: OPENDISPATCH_IAM_SESSION
    personalToken:
      type: http
      scheme: bearer
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Status:
      name: status
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Browser CSRF token obtained from GET /api/session/csrf and paired
        with the XSRF-TOKEN cookie.
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Positive aggregate version
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AuditReason:
      name: X-Audit-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    IamError:
      description: Stable IAM error contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IamApiError'
  schemas:
    UiDisplayMode:
      type: string
      enum: [HIDDEN, READ_ONLY, ENABLED]
    UiNavigationItem:
      type: object
      required: [featureId, section, order, route, label, purpose, displayMode, children]
      properties:
        featureId: { type: string }
        parentFeatureId: { type: string, nullable: true }
        section: { type: string }
        order: { type: integer }
        route:
          type: string
          description: Product-owned route template. `{tenantId}` is substituted only with the active canonical Tenant identifier.
        label: { type: string }
        purpose: { type: string }
        displayMode:
          $ref: '#/components/schemas/UiDisplayMode'
        children:
          type: array
          items:
            $ref: '#/components/schemas/UiNavigationItem'
    UiPageEntitlement:
      type: object
      required: [featureId, route, displayMode, allowed, denialReason, surface]
      properties:
        featureId: { type: string }
        route: { type: string }
        displayMode:
          $ref: '#/components/schemas/UiDisplayMode'
        allowed:
          type: boolean
          deprecated: true
          description: Contract 2.x compatibility projection. `displayMode` is authoritative in 3.0.
        denialReason: { type: string }
        surface:
          type: string
          enum: [TENANT, PLATFORM, INTERNAL_ENGINEERING]
    UiActionEntitlement:
      type: object
      required: [actionId, displayMode, scopes]
      properties:
        actionId: { type: string }
        displayMode:
          type: string
          enum: [HIDDEN, ENABLED]
        scopes:
          type: array
          items: { type: string }
    UiEntitlementResponse:
      type: object
      required: [contractVersion, workspaceKind, tenantId, navigation, pages, actions, actionEntitlements, actionScopes, generatedAt]
      properties:
        contractVersion:
          type: string
          enum: ['3.0']
        workspaceKind:
          type: string
          enum: [TENANT, INSTANCE_ROOT]
        tenantId: { type: string }
        navigation:
          type: array
          items:
            $ref: '#/components/schemas/UiNavigationItem'
        pages:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UiPageEntitlement'
        actions:
          type: array
          deprecated: true
          description: Contract 2.x compatibility projection. `actionEntitlements` is authoritative in 3.0.
          items: { type: string }
        actionEntitlements:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UiActionEntitlement'
        actionScopes:
          type: object
          deprecated: true
          additionalProperties:
            type: array
            items: { type: string }
        generatedAt:
          type: string
          format: date-time
    PreviewResponsibilityUiAccessRequest:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes:
          type: array
          uniqueItems: true
          items: {type: string}
    ResponsibilityUiAccessPreviewResponse:
      type: object
      required: [tenantId, roleId, generatedAt, permissionCodes, allowedScopeTypes, uiAccess]
      properties:
        tenantId: {type: string}
        roleId: {type: string}
        generatedAt: {type: string, format: date-time}
        permissionCodes:
          type: array
          uniqueItems: true
          items: {type: string}
        allowedScopeTypes:
          type: array
          uniqueItems: true
          items: {type: string}
        uiAccess:
          $ref: '#/components/schemas/UiEntitlementResponse'
    UiAccessGrantReasonResponse:
      type: object
      required: [permissionCode, bindingId, roleId, roleName, principalType, principalId, scopeType, scopeId, effectiveAt, inheritedFromGroup]
      properties:
        permissionCode: {type: string}
        bindingId: {type: string}
        roleId: {type: string}
        roleName: {type: string}
        principalType: {type: string}
        principalId: {type: string}
        scopeType: {type: string}
        scopeId: {type: string}
        effectiveAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}
        inheritedFromGroup: {type: boolean}
    EffectiveUiAccessResponse:
      type: object
      required: [tenantId, userId, evaluatedAt, uiAccess, pageReasons, actionReasons]
      properties:
        tenantId: {type: string}
        userId: {type: string}
        evaluatedAt: {type: string, format: date-time}
        uiAccess:
          $ref: '#/components/schemas/UiEntitlementResponse'
        pageReasons:
          type: object
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/UiAccessGrantReasonResponse'}
        actionReasons:
          type: object
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/UiAccessGrantReasonResponse'}
    UpdateDepartmentMembershipRequest:
      type: object
      additionalProperties: false
      required:
      - membershipType
      - primary
      - reason
      properties:
        membershipType:
          type: string
          enum:
          - MEMBER
          - DELEGATE
        primary:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        replacementMembershipId:
          type: string
          nullable: true
          description: Required when demoting the current Primary Department membership.
        replacementExpectedVersion:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        reason:
          type: string
          minLength: 12
          maxLength: 500
    EffectiveAccessSource:
      type: object
      required:
      - bindingId
      - roleId
      - roleName
      - principalType
      - principalId
      - scopeType
      - scopeId
      - effectiveAt
      - inheritedFromGroup
      properties:
        bindingId:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        principalType:
          type: string
        principalId:
          type: string
        scopeType:
          type: string
        scopeId:
          type: string
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        inheritedFromGroup:
          type: boolean
    EffectivePermission:
      type: object
      required:
      - permissionCode
      - sources
      - observations
      properties:
        permissionCode:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveAccessSource'
        observations:
          type: array
          items:
            type: string
    EffectiveAccess:
      type: object
      required:
      - tenantId
      - userId
      - evaluatedAt
      - permissions
      - conflicts
      properties:
        tenantId:
          type: string
        userId:
          type: string
        evaluatedAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
        conflicts:
          type: array
          items:
            type: string
    RoleBindingRevocationPreview:
      type: object
      required:
      - bindingId
      - roleId
      - roleName
      - scopeType
      - scopeId
      - permissionsLost
      - permissionsRetained
      - warnings
      properties:
        bindingId:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        scopeType:
          type: string
        scopeId:
          type: string
        permissionsLost:
          type: array
          items:
            type: string
        permissionsRetained:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    UserOnboardingRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - displayName
      - creationMode
      - authenticationMethod
      - activationDeliveryMethod
      - membershipId
      - membershipStatus
      - defaultTenant
      - membershipSource
      - applicationAccessDeferred
      - reason
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional controlled-import identifier. When omitted
          the server generates a retry-stable UUID from the Idempotency-Key.: null
        username:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        creationMode:
          type: string
          enum:
          - INVITATION
          - ADMIN_CREATED
          - LEGACY_IMPORT
        authenticationMethod:
          type: string
          enum: [LOCAL]
          description: P2.3A supports canonical local authentication. Enterprise IdP methods are reserved for P2.4.
        activationDeliveryMethod:
          type: string
          enum: [EMAIL, MANUAL, DEVELOPMENT_FILE]
          description: EMAIL uses configured SMTP; MANUAL returns the one-time setup URL in the no-store response; DEVELOPMENT_FILE is non-production compatibility.
        initialPassword:
          type: string
          minLength: 14
          maxLength: 1024
          writeOnly: true
          nullable: true
          description: Optional administrator-provisioned temporary password for a new ADMIN_CREATED identity. The credential is hashed immediately, excluded from idempotency persistence, never returned, and must be changed at first sign-in. Existing identities reject this field.
        membershipId:
          type: string
          minLength: 1
          maxLength: 128
        membershipStatus:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - SUSPENDED
          - EXPIRED
        employeeId:
          type: string
          maxLength: 128
          nullable: true
        membershipExpiresAt:
          type: string
          format: date-time
          nullable: true
        defaultTenant:
          type: boolean
        membershipSource:
          type: string
          enum:
          - ADMIN_CREATED
          - INVITATION
          - LEGACY_IMPORT
          - PLATFORM_PROVISIONING
        departments:
          type: array
          items:
            $ref: '#/components/schemas/UserOnboardingDepartmentAssignment'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UserOnboardingGroupAssignment'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserOnboardingRoleAssignment'
        applicationAccessDeferred:
          type: boolean
          description: Must be false for normal ADMIN_CREATED onboarding. Set true only when an administrator intentionally creates an authenticated Person with no business Responsibility yet; roles must then be empty and only My Account self-service is expected after sign-in setup.
        reason:
          type: string
