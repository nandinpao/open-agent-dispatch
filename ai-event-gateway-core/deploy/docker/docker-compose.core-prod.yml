services:
  ai-event-gateway-core:
    image: ${AI_EVENT_GATEWAY_CORE_IMAGE:?Set AI_EVENT_GATEWAY_CORE_IMAGE to an immutable registry image@sha256 digest}
    container_name: control-plane-prod
    env_file:
      - ../env/.env.core-common.example
      - ../env/.env.core-prod.example
    ports:
      - "18080:18080"
    restart: unless-stopped
